services:
  # Backend Web Service (FastAPI)
  - type: web
    name: growthisweek-backend
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: BACKBOARD_API_KEY
        sync: false
      - key: ELEVENLABS_API_KEY
        sync: false
      - key: SENTRY_DSN
        sync: false

  # Static Site Frontend (Vite React)
  - type: static
    name: growthisweek-frontend
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://growthisweek-backend.onrender.com
